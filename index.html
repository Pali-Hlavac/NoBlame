<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NoBlame</title>
    <script src="/theme-boot.js"></script>
    <!--
      The start screen and the loading bird, styled here so they apply from the first paint; the
      app's BirdLoader uses these classes too. Colours: --background, --foreground and
      --muted-foreground of src/app/styles.css.
    -->
    <style>
      html {
        background: oklch(0.995 0 0);
        color: oklch(0.21 0.01 220);
      }

      html.dark {
        background: oklch(0.18 0.012 210);
        color: oklch(0.96 0 0);
      }

      /* Shown until the app's code has loaded; StartupCurtain looks the same and replaces it. */
      .boot-screen {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          "Helvetica Neue",
          Arial,
          sans-serif;
        user-select: none;
      }

      .boot-screen .bird {
        height: 64px;
      }

      .boot-screen p {
        margin: 0;
        font-size: 14px;
        line-height: 20px;
        color: oklch(0.5 0.016 220);
      }

      html.dark .boot-screen p {
        color: oklch(0.72 0.014 210);
      }

      /* The bird (an inline SVG), sized by its height; its width follows the picture. */
      .bird {
        display: inline-block;
        flex-shrink: 0;
        width: auto;
        overflow: visible;
      }

      /* The notes leave the beak, rise and fade. */
      @keyframes bird-note {
        0% {
          opacity: 0;
          transform: translate(-6px, 6px) scale(0.5);
        }
        25%,
        65% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translate(3px, -4px) scale(1);
        }
      }

      .bird-note {
        transform-box: fill-box;
        transform-origin: center;
        animation: bird-note 1.8s ease-out infinite both;
      }

      .bird-note-late {
        animation-delay: 0.9s;
      }

      @media (prefers-reduced-motion: reduce) {
        .bird-note {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!--
        The start screen, shown until the app's code has loaded (seconds in dev, where Vite
        serves every module on its own). vite.config.ts fills it in from
        src/shared/lib/loadingBird.ts; StartupCurtain then replaces it without a visible change.
      -->
      <!-- start-screen -->
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
