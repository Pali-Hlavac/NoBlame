name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # The Rust version is pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: Formatting
        if: runner.os == 'Linux'
        run: pnpm format:check
      - name: Lint (ESLint + file sizes)
        run: pnpm lint
      - name: Type-check
        run: pnpm typecheck
      - name: Frontend tests
        run: pnpm test
      # axe-core on what every component test renders (src/test/axe.ts).
      - name: Accessibility audit
        if: runner.os == 'Linux'
        run: pnpm test:a11y
      # Also creates dist/, which tauri::generate_context! needs at compile time.
      - name: Frontend build
        run: pnpm exec vite build
      - name: Clippy
        run: pnpm lint:rust
      - name: Rust tests
        run: pnpm test:rust
      - name: IPC bindings are up to date
        if: runner.os == 'Linux'
        run: git diff --exit-code -- src/shared/ipc/bindings.ts

  commits:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: commitlint
        run: >-
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}

  e2e:
    name: End to end (${{ matrix.os }})
    # The real app through tauri-driver (ADR 0016); macOS has no WebDriver for its webview.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev webkit2gtk-driver xvfb
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # The Rust version is pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: Smoke tests
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm e2e
      - name: Smoke tests
        if: runner.os == 'Windows'
        run: pnpm e2e
      # The Edge WebDriver starts the app without a console, so a crash or a hang there leaves
      # no trace. When the smoke tests fail, start the app alone and say what it does.
      - name: The app on its own (after a failure)
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:NOBLAME_PROFILE_DIR = Join-Path $env:RUNNER_TEMP "noblame-profile"
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = "--remote-debugging-port=9222"
          $out = Join-Path $env:RUNNER_TEMP "app-out.txt"
          $err = Join-Path $env:RUNNER_TEMP "app-err.txt"
          $app = Start-Process "target/e2e/debug/noblame.exe" -PassThru `
            -RedirectStandardOutput $out -RedirectStandardError $err
          Start-Sleep -Seconds 20
          if ($app.HasExited) { "The app exited with code $($app.ExitCode)." } else { "The app is running." }
          try { (Invoke-WebRequest http://127.0.0.1:9222/json/version -UseBasicParsing).Content }
          catch { "WebView2 does not answer on its debugging port: $_" }
          Get-Process msedgewebview2 -ErrorAction SilentlyContinue | Select-Object Id, Path | Format-Table
          # The browser process (no --type=) shows whether the debugging port reached WebView2.
          "--- WebView2 browser processes"
          Get-CimInstance Win32_Process -Filter "Name = 'msedgewebview2.exe'" |
            Where-Object { $_.CommandLine -notmatch '--type=' } |
            ForEach-Object { "$($_.ProcessId) (parent $($_.ParentProcessId)): $($_.CommandLine)" }
          "--- the app: $((Get-CimInstance Win32_Process -Filter "ProcessId = $($app.Id)").CommandLine)"
          "--- WEBVIEW2_* variables"
          Get-ChildItem env:WEBVIEW2* | ForEach-Object { "$($_.Name)=$($_.Value)" }
          "--- Edge and WebView2 policies"
          foreach ($root in 'HKLM:\SOFTWARE\Policies\Microsoft\Edge', 'HKCU:\SOFTWARE\Policies\Microsoft\Edge') {
            if (Test-Path $root) { Get-ChildItem $root -Recurse | Out-String; Get-ItemProperty $root | Out-String }
            else { "${root}: none" }
          }
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          "WebView2 runtime: $((Get-ItemProperty $key -ErrorAction SilentlyContinue).pv)"
          "--- the app's output"
          Get-Content $out, $err -ErrorAction SilentlyContinue
          if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
