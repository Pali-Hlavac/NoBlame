name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: Formatting
        if: runner.os == 'Linux'
        run: pnpm format:check
      - name: Lint (ESLint + file sizes)
        run: pnpm lint
      - name: Type-check
        run: pnpm typecheck
      - name: Frontend tests
        run: pnpm test
      # axe-core on what every component test renders (src/test/axe.ts).
      - name: Accessibility audit
        if: runner.os == 'Linux'
        run: pnpm test:a11y
      # Also creates dist/, which tauri::generate_context! needs at compile time.
      - name: Frontend build
        run: pnpm exec vite build
      - name: Clippy
        run: pnpm lint:rust
      - name: Rust tests
        run: pnpm test:rust
      - name: IPC bindings are up to date
        if: runner.os == 'Linux'
        run: git diff --exit-code -- src/shared/ipc/bindings.ts

  commits:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: commitlint
        run: >-
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
