name: Release

# A version tag (v0.2.0) makes a draft GitHub release with the changelog's section as its text,
# builds the installers for Windows, macOS and Linux and uploads them into it with the update
# feed (latest.json); publishing the draft is a person's step. What is signed depends on the repository's secrets (docs/development/release.md):
# without them the installers are unsigned and the builds do not update themselves.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  check:
    name: Version matches the tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/release-version.mjs --check "${GITHUB_REF_NAME}"

  # One draft for the tag, made here by tag name only, before the builds upload into it. When
  # tauri-action made it, it named the commit (target_commitish) and GitHub refused the workflow's
  # token ("Resource not accessible by integration", v0.3.0); it also let the three builds race to
  # make one each. A draft already there for the tag (made by hand, or by an earlier attempt) is
  # used as it is, so making it by hand and re-running still works.
  draft:
    name: Draft release
    needs: check
    runs-on: ubuntu-24.04
    outputs:
      id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n 1)
          if [ -z "$id" ]; then
            # The changelog's section for this version is the release's text.
            awk -v heading="## [${TAG#v}]" '
              index($0, "## [") == 1 { if (found) exit; found = (index($0, heading) == 1); next }
              found' CHANGELOG.md > notes.md
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$TAG" \
              -f name="NoBlame $TAG" -F draft=true -F body=@notes.md --jq .id)
            echo "Made a draft release for $TAG."
          else
            echo "Using the release already there for $TAG."
          fi
          [ -n "$id" ] || { echo "No release for $TAG."; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: draft
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            args: ""
          - name: macOS universal
            os: macos-latest
            args: "--target universal-apple-darwin"
          # The oldest supported Ubuntu, so the AppImage and packages run on older glibc too.
          - name: Linux x64
            os: ubuntu-22.04
            args: ""
    env:
      # Built into the app: the key update signatures are checked with, and the feed.
      NOBLAME_UPDATER_PUBKEY: ${{ vars.NOBLAME_UPDATER_PUBKEY }}
      NOBLAME_UPDATER_ENDPOINT: ${{ vars.NOBLAME_UPDATER_PUBKEY != '' && format('{0}/{1}/releases/latest/download/latest.json', github.server_url, github.repository) || '' }}
      # Signs the updates (tauri signer generate); the public half is the variable above.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # Steps cannot test secrets in `if`; this says whether there is a Windows certificate.
      WINDOWS_CERTIFICATE_SET: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # The Rust version is pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: Import the Windows signing certificate
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE_SET == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "certificate.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          "WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" >> $env:GITHUB_ENV
      # macOS: Developer ID signing and notarization, read by the bundler from APPLE_*. A missing
      # secret still makes an empty variable, and the bundler signs as soon as APPLE_CERTIFICATE
      # exists (an empty one fails: "Unable to decode the provided data"), so only the secrets
      # that are set are passed on.
      - name: Apple signing (when its secrets are set)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
            APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!name}" ]; then
              { echo "$name<<NOBLAME_EOF"; echo "${!name}"; echo "NOBLAME_EOF"; } >> "$GITHUB_ENV"
            fi
          done
          [ -n "$APPLE_CERTIFICATE" ] || echo "No Apple certificate: the app is not signed or notarized."
      - name: What this build signs
        run: node scripts/release-config.mjs
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Uploads into the draft made above; with an id the action neither looks for a release
          # nor makes one. The body is only the update feed's notes.
          releaseId: ${{ needs.draft.outputs.id }}
          releaseBody: See CHANGELOG.md for what changed.
          includeUpdaterJson: ${{ env.TAURI_SIGNING_PRIVATE_KEY != '' }}
          args: --config src-tauri/tauri.release.json ${{ matrix.args }}
