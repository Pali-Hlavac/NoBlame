[package]
name = "git-core"
description = "NoBlame's Git engine: repository reads, git CLI runner, graph layout. No Tauri dependency."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
gix = { version = "0.90", default-features = false, features = ["max-performance", "revision", "sha1"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "macros", "rt"] }
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
gix = { version = "0.90", default-features = false, features = ["max-performance", "revision", "sha1"] }
noblame-repo-gen = { path = "../repo-gen" }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }

[lints]
workspace = true

[[bench]]
name = "graph"
harness = false
