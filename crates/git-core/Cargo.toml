[package]
name = "git-core"
description = "NoBlame's Git engine: repository reads, git CLI runner, graph layout. No Tauri dependency."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
gix = { version = "0.90", default-features = false, features = ["attributes", "blob-diff", "max-performance", "revision", "sha1"] }
# The interactive rebase's todo file (deleted afterwards). MIT OR Apache-2.0.
tempfile.workspace = true
thiserror.workspace = true
# Reading `git lfs locks --json`. MIT OR Apache-2.0.
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "macros", "rt"] }
# Pinned: 8.2.1 was days old when added (2026-10-28). CC0-1.0 / MIT OR Apache-2.0.
notify = "=8.2.0"
notify-debouncer-mini = "=0.7.0"
# MIT. Pure-Rust regexes: with Oniguruma the parser state is not `Send`, so it could not be
# cached across threads. The grammars come from two-face.
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy"] }
tokio-util.workspace = true
tracing.workspace = true
# MIT OR Apache-2.0: bat's 213 grammars for syntect (TypeScript, TOML, Kotlin, Swift, Vue, ...).
# Their own licences are MIT, Apache-2.0 and Sublime HQ's (`two_face::acknowledgement`); none
# is copyleft. Pinned: released 2026-08-07.
two-face = { version = "=0.5.2", default-features = false, features = ["syntect-fancy"] }

# Killing git's whole process tree on cancel (`cli/tree.rs`). MIT OR Apache-2.0.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["process"] }

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
gix = { version = "0.90", default-features = false, features = ["attributes", "blob-diff", "max-performance", "revision", "sha1"] }
noblame-repo-gen = { path = "../repo-gen" }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }

[lints]
workspace = true

[[bench]]
name = "graph"
harness = false
