<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="NoBlame">
  <title>NoBlame: a finch on a branch</title>
  <!-- Master logo (first version, M1). All platform icons are generated from this file with `pnpm icons`. -->
  <rect width="512" height="512" rx="112" fill="#123B3D"/>
  <!-- The branch, which is also a Git branch: a main line, a forked line and commit nodes. -->
  <g fill="none" stroke="#EADFC9" stroke-linecap="round" stroke-width="30">
    <path d="M52 404 L462 344"/>
    <path d="M138 391 C 186 384, 196 446, 252 446 L 300 446"/>
  </g>
  <g fill="#EADFC9">
    <circle cx="300" cy="446" r="26"/>
    <circle cx="96" cy="398" r="26"/>
    <circle cx="438" cy="348" r="26"/>
  </g>
  <g fill="#123B3D">
    <circle cx="300" cy="446" r="11"/>
    <circle cx="96" cy="398" r="11"/>
    <circle cx="438" cy="348" r="11"/>
  </g>
  <!-- The finch (a goldfinch): tail, legs, body, wing, head, cap, beak, eye. -->
  <path d="M196 296 L92 332 L112 292 L176 262 Z" fill="#1E2A32"/>
  <g stroke="#E8833A" stroke-linecap="round" stroke-width="12">
    <path d="M262 334 L256 372"/>
    <path d="M300 330 L298 366"/>
  </g>
  <ellipse cx="270" cy="262" rx="104" ry="80" transform="rotate(-18 270 262)" fill="#FFC83D"/>
  <path d="M176 278 C 206 222, 278 214, 318 246 C 290 286, 230 304, 176 278 Z" fill="#1E2A32"/>
  <path d="M204 284 C 240 292, 278 282, 302 262" fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-width="11"/>
  <circle cx="352" cy="186" r="62" fill="#FFC83D"/>
  <path d="M302 160 C 318 120, 382 112, 408 150 C 380 150, 340 156, 302 160 Z" fill="#1E2A32"/>
  <path d="M406 172 L456 192 L408 212 Z" fill="#E8833A"/>
  <circle cx="372" cy="182" r="11" fill="#1E2A32"/>
</svg>
