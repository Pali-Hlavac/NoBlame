[package]
name = "noblame"
description = "NoBlame - a fast, cross-platform Git client for giant repositories"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true
default-run = "noblame"

[lib]
name = "noblame_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "noblame"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
clap.workspace = true
git-core = { path = "../crates/git-core" }
serde.workspace = true
serde_json.workspace = true
# specta crates are pre-releases that must move together (CLAUDE.md → Gotchas).
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
specta-typescript = "=0.0.13"
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-single-instance = "2"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_System_Console"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
